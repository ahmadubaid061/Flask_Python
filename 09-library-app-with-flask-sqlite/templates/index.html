<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Library</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 15px; }
        h1 { text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
        form.filter-form { margin: 0; }
        .dashboard-link { background: #4CAF50; color: white; padding: 8px 14px; text-decoration: none; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>📚 My Library</h1>

    <div class="top-bar">
        <form class="filter-form" method="get" action="{{ url_for('index') }}">
            <label for="category">Filter by category:</label>
            <select name="category" id="category" onchange="this.form.submit()">
                <option value="" {% if selected_category == "" %}selected{% endif %}>All</option>
                {% for c in categories %}
                    <option value="{{ c['category'] }}" {% if selected_category == c['category'] %}selected{% endif %}>
                        {{ c['category'] }}
                    </option>
                {% endfor %}
            </select>
        </form>

        <a class="dashboard-link" href="{{ url_for('dashboard') }}">Manage Books</a>
    </div>

    <table>
        <tr>
            <th>Title</th>
            <th>Author</th>
            <th>Category</th>
        </tr>
        {% for book in books %}
        <tr>
            <td>{{ book['title'] }}</td>
            <td>{{ book['author'] }}</td>
            <td>{{ book['category'] }}</td>
        </tr>
        {% else %}
        <tr>
            <td colspan="3">No books found.</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
