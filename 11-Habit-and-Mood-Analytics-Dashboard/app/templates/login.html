{% extends 'base.html' %}
{% block content %}
<h2>Log In</h2>
<form method="POST">
    {{ form.hidden_tag() }}

    <div class="mb-3">
        {{ form.email.label }}
        {{ form.email(class='form-control') }}
    </div>

    <div class="mb-3">
        {{ form.password.label }}
        {{ form.password(class='form-control') }}
    </div>

    {{ form.submit(class='btn btn-primary') }}
</form>
<p class="mt-3">No account? <a href="{{ url_for('auth.register') }}">Sign up</a></p>
{% endblock %}
