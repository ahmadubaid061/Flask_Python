<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Habit & Mood Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand navbar-light bg-light px-3">
        <a class="navbar-brand" href="{{ url_for('main.home') }}">Habit & Mood</a>
        {% if current_user.is_authenticated %}
        <div>
            <a href="{{ url_for('dashboard.home') }}">Dashboard</a> |
            <a href="{{ url_for('logs.log_today') }}">Log Today</a> |
            <a href="{{ url_for('habits.list_habits') }}">Habits</a> |
            <a href="{{ url_for('auth.logout') }}">Logout</a>
        </div>
        {% endif %}
    </nav>

    <div class="container mt-4">
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-info">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>
</body>

</html>
